<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="dg-pe-title dg-pe-desc">
  <title id="dg-pe-title">Architecture of the hospitality pricing and revenue module</title>
  <desc id="dg-pe-desc">Property managers use a Next.js and TypeScript interface. It calls Supabase Edge Functions that run the TypeScript pricing computation engine. The engine reads and writes a restructured Supabase PostgreSQL schema built around five core tables.</desc>
  <style>
    .dg-box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
    .dg-key { fill: var(--kraft-soft); stroke: var(--accent); stroke-width: 1.5; }
    .dg-t { fill: var(--text); font: 600 15px 'Archivo Variable', system-ui, sans-serif; }
    .dg-s { fill: var(--muted); font: 400 12.5px 'Archivo Variable', system-ui, sans-serif; }
    .dg-a { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#dg-pe-arrow); }
  </style>
  <defs>
    <marker id="dg-pe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" style="fill: var(--muted)" />
    </marker>
  </defs>

  <rect class="dg-box" x="8" y="20" width="190" height="72" rx="8" />
  <text class="dg-t" x="103" y="48" text-anchor="middle">Pricing &amp; revenue UI</text>
  <text class="dg-s" x="103" y="67" text-anchor="middle">Next.js, TypeScript</text>
  <path class="dg-a" d="M198 56 H240" />

  <rect class="dg-key" x="246" y="20" width="190" height="72" rx="8" />
  <text class="dg-t" x="341" y="48" text-anchor="middle">Pricing engine</text>
  <text class="dg-s" x="341" y="67" text-anchor="middle">TypeScript on Supabase</text>
  <text class="dg-s" x="341" y="83" text-anchor="middle">Edge Functions</text>
  <path class="dg-a" d="M436 56 H478" />

  <rect class="dg-box" x="484" y="20" width="148" height="72" rx="8" />
  <text class="dg-t" x="558" y="48" text-anchor="middle">PostgreSQL</text>
  <text class="dg-s" x="558" y="67" text-anchor="middle">5 core tables,</text>
  <text class="dg-s" x="558" y="83" text-anchor="middle">migrated schema</text>

  <rect class="dg-box" x="8" y="180" width="624" height="100" rx="8" style="fill: none; stroke-dasharray: 5 5" />
  <text class="dg-t" x="320" y="212" text-anchor="middle">Delivery loop</text>
  <text class="dg-s" x="320" y="236" text-anchor="middle">spec → AI-assisted generation (Claude Code) → multi-agent review and tests → ship</text>
  <text class="dg-s" x="320" y="258" text-anchor="middle">same-day turnaround on client feedback</text>
  <path class="dg-a" d="M320 150 V174" />
  <text class="dg-s" x="320" y="138" text-anchor="middle">every feature in the module went through</text>
</svg>
